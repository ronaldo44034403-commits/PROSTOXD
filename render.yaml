services:
  - type: web
    name: phone-vps
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: TOKEN
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.3
